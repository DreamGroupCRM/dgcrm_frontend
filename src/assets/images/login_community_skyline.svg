<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Residential community skyline at dusk">
  <title>Dream Group residential community at dusk</title>
  <defs>
    <!-- Dusk sky: deep indigo overhead falling to a warm horizon glow. -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0a1330"/>
      <stop offset="42%"  stop-color="#152a5c"/>
      <stop offset="66%"  stop-color="#33578f"/>
      <stop offset="82%"  stop-color="#8d6f92"/>
      <stop offset="100%" stop-color="#e8a06f"/>
    </linearGradient>

    <radialGradient id="sunGlow" cx="0.68" cy="0.80" r="0.52">
      <stop offset="0%"   stop-color="#ffd4a3" stop-opacity="0.95"/>
      <stop offset="42%"  stop-color="#f0a274" stop-opacity="0.52"/>
      <stop offset="100%" stop-color="#e79a6b" stop-opacity="0"/>
    </radialGradient>

    <!-- Three depth planes: farthest is the most washed out by haze. -->
    <linearGradient id="farTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#2a3f6d"/>
      <stop offset="100%" stop-color="#3c5580"/>
    </linearGradient>
    <linearGradient id="midTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#16244a"/>
      <stop offset="100%" stop-color="#24365f"/>
    </linearGradient>
    <linearGradient id="nearTower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0b1330"/>
      <stop offset="100%" stop-color="#131f41"/>
    </linearGradient>

    <!-- Lit windows, drawn once per plane and tiled. Keeping these as a
         pattern instead of thousands of individual rects is what keeps the
         whole file a few KB while staying sharp at any resolution. -->
    <pattern id="winFar" width="26" height="34" patternUnits="userSpaceOnUse">
      <rect x="6" y="8" width="10" height="13" fill="#ffd9a0" opacity="0.30"/>
    </pattern>
    <pattern id="winMid" width="30" height="40" patternUnits="userSpaceOnUse">
      <rect x="7" y="9" width="12" height="16" fill="#ffd9a0" opacity="0.46"/>
    </pattern>
    <pattern id="winNear" width="36" height="48" patternUnits="userSpaceOnUse">
      <rect x="9" y="11" width="15" height="20" fill="#ffe2b4" opacity="0.62"/>
    </pattern>

    <!-- Ground haze so the towers sit in the scene rather than on top of it. -->
    <linearGradient id="groundHaze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#e8a06f" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#050a1c" stop-opacity="0.88"/>
    </linearGradient>

    <!-- Readability wash. The login card sits centre-screen, so the middle
         is darkened hardest and the edges keep some of the scene. -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0%"   stop-color="#04070f" stop-opacity="0.42"/>
      <stop offset="55%"  stop-color="#04070f" stop-opacity="0.26"/>
      <stop offset="100%" stop-color="#04070f" stop-opacity="0.60"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <rect width="1920" height="1080" fill="url(#sunGlow)"/>

  <!-- Stars, sparse and only in the upper third. -->
  <g fill="#e8eeff" opacity="0.5">
    <circle cx="180"  cy="92"  r="1.6"/><circle cx="430"  cy="164" r="1.2"/>
    <circle cx="726"  cy="72"  r="1.5"/><circle cx="1012" cy="140" r="1.1"/>
    <circle cx="1298" cy="86"  r="1.6"/><circle cx="1554" cy="188" r="1.2"/>
    <circle cx="1802" cy="108" r="1.4"/><circle cx="596"  cy="248" r="1.0"/>
    <circle cx="1146" cy="232" r="1.0"/><circle cx="1690" cy="286" r="1.0"/>
  </g>

  <!-- ── Far plane ─────────────────────────────────────────────────── -->
  <g>
    <g fill="url(#farTower)">
      <rect x="40"   y="470" width="150" height="400"/>
      <rect x="215"  y="386" width="124" height="484"/>
      <rect x="470"  y="512" width="168" height="358"/>
      <rect x="980"  y="440" width="140" height="430"/>
      <rect x="1300" y="498" width="158" height="372"/>
      <rect x="1640" y="418" width="132" height="452"/>
      <rect x="1800" y="530" width="120" height="340"/>
    </g>
    <g fill="url(#winFar)">
      <rect x="40"   y="470" width="150" height="400"/>
      <rect x="215"  y="386" width="124" height="484"/>
      <rect x="470"  y="512" width="168" height="358"/>
      <rect x="980"  y="440" width="140" height="430"/>
      <rect x="1300" y="498" width="158" height="372"/>
      <rect x="1640" y="418" width="132" height="452"/>
      <rect x="1800" y="530" width="120" height="340"/>
    </g>
  </g>

  <!-- ── Mid plane — the tall residential towers ───────────────────── -->
  <g>
    <g fill="url(#midTower)">
      <rect x="150"  y="330" width="186" height="560"/>
      <rect x="360"  y="250" width="164" height="640"/>
      <rect x="700"  y="360" width="200" height="530"/>
      <rect x="1120" y="292" width="176" height="598"/>
      <rect x="1420" y="348" width="192" height="542"/>
      <rect x="1700" y="300" width="150" height="590"/>
      <!-- Rooftop water tanks / service blocks. -->
      <rect x="404"  y="214" width="58"  height="38"/>
      <rect x="1176" y="256" width="52"  height="38"/>
      <rect x="1744" y="264" width="48"  height="38"/>
    </g>
    <g fill="url(#winMid)">
      <rect x="150"  y="330" width="186" height="560"/>
      <rect x="360"  y="250" width="164" height="640"/>
      <rect x="700"  y="360" width="200" height="530"/>
      <rect x="1120" y="292" width="176" height="598"/>
      <rect x="1420" y="348" width="192" height="542"/>
      <rect x="1700" y="300" width="150" height="590"/>
    </g>
  </g>

  <!-- ── Near plane — low-rise homes along the street ──────────────── -->
  <g>
    <g fill="url(#nearTower)">
      <rect x="-20" y="620" width="230" height="300"/>
      <rect x="560" y="576" width="252" height="344"/>
      <rect x="900" y="640" width="196" height="280"/>
      <rect x="1540" y="596" width="240" height="324"/>
      <!-- Pitched roofs on the two row-house clusters. -->
      <polygon points="248,700 380,616 512,700"/>
      <polygon points="1160,714 1284,634 1408,714"/>
      <rect x="248"  y="700" width="264" height="220"/>
      <rect x="1160" y="714" width="248" height="206"/>
    </g>
    <g fill="url(#winNear)">
      <rect x="-20" y="620" width="230" height="300"/>
      <rect x="560" y="576" width="252" height="344"/>
      <rect x="900" y="640" width="196" height="280"/>
      <rect x="1540" y="596" width="240" height="324"/>
      <rect x="248"  y="700" width="264" height="220"/>
      <rect x="1160" y="714" width="248" height="206"/>
    </g>
  </g>

  <!-- ── Trees along the avenue ────────────────────────────────────── -->
  <g fill="#060d22">
    <g transform="translate(120,920)">
      <rect x="-5" y="-54" width="10" height="54"/>
      <ellipse cx="0" cy="-74" rx="40" ry="46"/>
    </g>
    <g transform="translate(530,930)">
      <rect x="-6" y="-62" width="12" height="62"/>
      <ellipse cx="0" cy="-84" rx="46" ry="52"/>
    </g>
    <g transform="translate(1046,926)">
      <rect x="-5" y="-56" width="10" height="56"/>
      <ellipse cx="0" cy="-78" rx="42" ry="48"/>
    </g>
    <g transform="translate(1480,934)">
      <rect x="-6" y="-64" width="12" height="64"/>
      <ellipse cx="0" cy="-88" rx="48" ry="54"/>
    </g>
    <g transform="translate(1852,922)">
      <rect x="-5" y="-52" width="10" height="52"/>
      <ellipse cx="0" cy="-72" rx="38" ry="44"/>
    </g>
  </g>

  <!-- ── Street lamps, each with its own pool of warm light ────────── -->
  <g>
    <g opacity="0.75" fill="#ffd9a0">
      <ellipse cx="330"  cy="948" rx="72" ry="16"/>
      <ellipse cx="860"  cy="952" rx="72" ry="16"/>
      <ellipse cx="1330" cy="948" rx="72" ry="16"/>
      <ellipse cx="1760" cy="952" rx="72" ry="16"/>
    </g>
    <g fill="#060d22">
      <rect x="326"  y="838" width="8" height="112"/>
      <rect x="856"  y="842" width="8" height="112"/>
      <rect x="1326" y="838" width="8" height="112"/>
      <rect x="1756" y="842" width="8" height="112"/>
    </g>
    <g fill="#ffe2b4">
      <circle cx="330"  cy="834" r="9"/>
      <circle cx="860"  cy="838" r="9"/>
      <circle cx="1330" cy="834" r="9"/>
      <circle cx="1760" cy="838" r="9"/>
    </g>
  </g>

  <!-- ── Ground ────────────────────────────────────────────────────── -->
  <rect x="0" y="918" width="1920" height="162" fill="#04081a"/>
  <rect x="0" y="860" width="1920" height="120" fill="url(#groundHaze)"/>

  <!-- ── Readability wash over the whole scene ─────────────────────── -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
